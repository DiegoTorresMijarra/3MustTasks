<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hoy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F8; font-family: Manrope, system-ui, sans-serif; color: #15171C; box-sizing: border-box">

  <header style="padding: 56px 20px 14px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 14px; font-weight: 600; color: #5B6170">Miércoles, 21 de octubre</div>
      <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Hoy</h1>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #5B6170">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C9372C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-1.7.7-2.9 1.6-3.8.3 1.3 1 2 1.9 2.3C11 7.8 11.4 5.2 12 3z"/></svg>
        Racha de 6 días cumplidos
      </div>
    </div>
    <div role="img" aria-label="{{ringLabel}}" style="position: relative; width: 72px; height: 72px; flex-shrink: 0">
      <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
        <circle cx="36" cy="36" r="30" fill="none" stroke="#E3E6EB" stroke-width="7"/>
        <circle cx="36" cy="36" r="30" fill="none" stroke="#15171C" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 36 36)"/>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <div style="font-size: 18px; font-weight: 800; line-height: 1">{{doneCount}}/{{total}}</div>
        <div style="font-size: 10px; font-weight: 700; color: #5B6170; margin-top: 2px">HECHAS</div>
      </div>
    </div>
  </header>

  <sc-if value="{{fulfilled}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="margin: 0 20px 12px; padding: 12px 14px; border-radius: 14px; background: #15171C; color: #FFFFFF; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      Día cumplido. Lo que hagas ahora es extra.
    </div>
  </sc-if>

  <main style="padding: 0 20px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="width: 10px; height: 10px; border-radius: 3px; background: {{g.color}}"></span>
            <h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: {{g.text}}">{{g.name}}</h2>
          </div>
          <div style="font-size: 12px; font-weight: 700; color: {{g.progInk}}">{{g.progress}}</div>
        </div>
        <sc-for list="{{g.tasks}}" as="t" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; min-height: 60px; border: 1px solid #E3E6EB; border-radius: 14px; background: #FFFFFF">
            <button onClick="{{t.toggle}}" aria-pressed="{{t.done}}" aria-label="{{t.toggleLabel}}" style="width: 56px; align-self: stretch; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
              <sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}">
                <span style="width: 26px; height: 26px; border-radius: 50%; background: {{g.color}}; display: flex; align-items: center; justify-content: center">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                </span>
              </sc-if>
              <sc-if value="{{t.pending}}" hint-placeholder-val="{{ true }}">
                <span style="width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid {{g.color}}; box-sizing: border-box"></span>
              </sc-if>
            </button>
            <a href="NuevaTarea.dc.html" style="flex: 1; min-width: 0; align-self: stretch; padding: 10px 14px 10px 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; text-decoration: none; color: #15171C">
              <sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 15px; font-weight: 600; color: #8A909C; text-decoration: line-through">{{t.title}}</span>
              </sc-if>
              <sc-if value="{{t.pending}}" hint-placeholder-val="{{ true }}">
                <span style="font-size: 15px; font-weight: 600">{{t.title}}</span>
              </sc-if>
              <span style="display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: #5B6170">
                <sc-if value="{{t.pinned}}" hint-placeholder-val="{{ false }}">
                  <span style="display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 6px; background: #15171C; color: #FFFFFF; font-weight: 700">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6 4 4H6l4-4z"/><path d="M12 13v8"/></svg>Fijada · día {{t.pinDay}}
                  </span>
                </sc-if>
                <span style="display: inline-flex; align-items: center; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.catColor}}"></span>{{t.cat}}</span>
                <sc-if value="{{t.hasTime}}" hint-placeholder-val="{{ false }}">
                  <span style="display: inline-flex; align-items: center; gap: 4px">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>{{t.time}}
                  </span>
                </sc-if>
              </span>
            </a>
          </div>
        </sc-for>
        <sc-for list="{{g.slots}}" as="s" hint-placeholder-count="1">
          <a href="Planificar.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border: 1.5px dashed #C4C9D2; border-radius: 14px; font-size: 14px; font-weight: 600; color: #5B6170; text-decoration: none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Añadir {{g.name}} (opcional)
          </a>
        </sc-for>
      </section>
    </sc-for>
  </main>

  <a href="Planificar.dc.html" aria-label="Añadir tarea" style="position: absolute; right: 20px; bottom: 100px; width: 60px; height: 60px; border-radius: 20px; background: #15171C; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(21,23,28,0.25)">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </a>

  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E3E6EB; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #15171C; font-size: 12px; font-weight: 800">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Hoy
    </a>
    <a href="Pool.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600; position: relative">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg>Pool
      <span style="position: absolute; top: -4px; right: 12px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #C9372C; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">12</span>
    </a>
    <a href="Semana.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>Calendario
    </a>
    <a href="Ajustes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { t2: true } };
  }
  renderVals() {
    var self = this;
    var done = this.state.done;
    var raw = [
      { id: 'must', name: 'Must', color: '#C9372C', text: '#B0302A', minDone: 1, slots: 0, tasks: [
        { id: 't1', title: 'Renovar el DNI', cat: 'Personal', catColor: '#8A4FD1', time: '', pinned: true, pinDay: 3 }
      ]},
      { id: 'rec', name: 'Recommended', color: '#E0A100', text: '#8A5A00', minDone: 0, slots: 0, tasks: [
        { id: 't2', title: 'Enviar propuesta a Ortega S.L.', cat: 'Trabajo', catColor: '#2559C7', time: '10:00' },
        { id: 't3', title: '30 min de inglés', cat: 'Personal', catColor: '#8A4FD1', time: '19:30' }
      ]},
      { id: 'maybe', name: 'Maybe', color: '#2559C7', text: '#2559C7', minDone: 0, slots: 1, tasks: [] }
    ];
    var total = 0, doneCount = 0, fulfilled = true;
    var groups = raw.map(function (g) {
      var gd = 0;
      var tasks = g.tasks.map(function (t) {
        var d = !!done[t.id];
        if (d) gd++;
        return Object.assign({}, t, {
          done: d, pending: !d, hasTime: !!t.time, pinned: !!t.pinned,
          toggleLabel: (d ? 'Destachar ' : 'Tachar ') + t.title,
          toggle: function () {
            var next = Object.assign({}, self.state.done);
            next[t.id] = !next[t.id];
            self.setState({ done: next });
          }
        });
      });
      total += tasks.length; doneCount += gd;
      var met = gd >= g.minDone;
      if (!met) fulfilled = false;
      var progress = g.minDone > 0
        ? (met ? 'Completadas ' + gd + '/' + g.minDone + ' ✓' : 'Completa ' + (g.minDone - gd) + ' más (mín. ' + g.minDone + ')')
        : (tasks.length ? gd + '/' + tasks.length + ' hechas' : 'Opcional');
      var slots = []; for (var i = 0; i < g.slots; i++) slots.push({ i: i });
      return Object.assign({}, g, { tasks: tasks, slots: slots, progress: progress, progInk: (g.minDone > 0 && !met) ? '#B0302A' : '#5B6170' });
    });
    var c = 2 * Math.PI * 30;
    var frac = total ? doneCount / total : 0;
    return {
      groups: groups, total: total, doneCount: doneCount, fulfilled: fulfilled,
      dash: (c * frac).toFixed(1) + ' ' + c.toFixed(1),
      ringLabel: doneCount + ' de ' + total + ' tareas hechas'
    };
  }
}
</script>
</body>
</html>
