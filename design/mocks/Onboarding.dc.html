<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: Manrope, system-ui, sans-serif; color: #15171C; box-sizing: border-box; display: flex; flex-direction: column">

  <div style="padding: 56px 24px 0; display: flex; align-items: center; justify-content: space-between">
    <div aria-label="Paso 2 de 3" style="display: flex; gap: 6px">
      <span style="width: 24px; height: 6px; border-radius: 3px; background: #15171C"></span>
      <span style="width: 24px; height: 6px; border-radius: 3px; background: #15171C"></span>

  <div style="padding: 24px 24px 0; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15">¿Cuántas tareas quieres cada día?</h1>
    <p style="margin: 0; font-size: 15px; font-weight: 500; color: #5B6170; line-height: 1.5">Pocas y claras. Podrás cambiarlo cuando quieras en Ajustes.</p>
  </div>

  <fieldset style="border: 0; margin: 0; padding: 24px 24px 0; display: flex; flex-direction: column; gap: 10px">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden">Composición del día</legend>
    <label style="padding: 16px; border-radius: 18px; border: 2px solid #15171C; display: flex; align-items: center; gap: 14px">
      <input type="radio" name="preset" checked style="width: 22px; height: 22px; accent-color: #15171C; margin: 0">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span style="font-size: 16px; font-weight: 800">Equilibrado</span>
          <span style="padding: 3px 8px; border-radius: 6px; background: #15171C; color: #FFFFFF; font-size: 11px; font-weight: 800">RECOMENDADO</span>
        </span>
        <span style="display: flex; gap: 6px">
          <span style="padding: 4px 8px; border-radius: 6px; background: #FBEAE8; color: #B0302A; font-size: 12px; font-weight: 800">1 Must</span>
          <span style="padding: 4px 8px; border-radius: 6px; background: #FDF3DC; color: #8A5A00; font-size: 12px; font-weight: 800">2 Recommended</span>
        </span>
      </span>
    </label>
    <label style="padding: 16px; border-radius: 18px; border: 1px solid #E3E6EB; display: flex; align-items: center; gap: 14px">
      <input type="radio" name="preset" style="width: 22px; height: 22px; accent-color: #15171C; margin: 0">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 16px; font-weight: 800">Exigente</span>
        <span style="display: flex; gap: 6px">
          <span style="padding: 4px 8px; border-radius: 6px; background: #FBEAE8; color: #B0302A; font-size: 12px; font-weight: 800">2 Must</span>
          <span style="padding: 4px 8px; border-radius: 6px; background: #FDF3DC; color: #8A5A00; font-size: 12px; font-weight: 800">1 Recommended</span>
        </span>
      </span>
    </label>
    <label style="padding: 16px; border-radius: 18px; border: 1px solid #E3E6EB; display: flex; align-items: center; gap: 14px">
      <input type="radio" name="preset" style="width: 22px; height: 22px; accent-color: #15171C; margin: 0">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 16px; font-weight: 800">Modo bestia</span>
        <span style="display: flex; gap: 6px">
          <span style="padding: 4px 8px; border-radius: 6px; background: #FBEAE8; color: #B0302A; font-size: 12px; font-weight: 800">3 Must</span>
        </span>
      </span>
    </label>
    <label style="padding: 16px; border-radius: 18px; border: 1px solid #E3E6EB; display: flex; align-items: center; gap: 14px">
      <input type="radio" name="preset" style="width: 22px; height: 22px; accent-color: #15171C; margin: 0">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 800">Personalizado</span>
        <span style="font-size: 13px; font-weight: 500; color: #5B6170">Elige niveles, mínimos y colores</span>
      </span>
    </label>
  </fieldset>

  <div style="margin: 18px 24px 0; padding: 14px 16px; border-radius: 14px; background: #F5F6F8; font-size: 13px; font-weight: 500; color: #3D424D; line-height: 1.5">
    Cada día te pediremos <b style="font-weight: 800; color: #15171C">añadir</b> estas 3 tareas. El día cuenta como <b style="font-weight: 800; color: #15171C">cumplido</b> si <b style="font-weight: 800; color: #15171C">completas</b> la Must.
  </div>

  <div style="margin-top: auto; padding: 0 24px 40px">
    <button style="width: 100%; min-height: 56px; border-radius: 16px; border: 0; background: #15171C; color: #FFFFFF; font-size: 16px; font-weight: 800">Continuar</button>
  </div>
</div>
</x-dc>
