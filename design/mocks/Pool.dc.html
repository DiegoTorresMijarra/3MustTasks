<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pool</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F8; font-family: Manrope, system-ui, sans-serif; color: #15171C; box-sizing: border-box">

  <header style="padding: 56px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div>
        <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Pool</h1>
        <div style="font-size: 13px; font-weight: 600; color: #5B6170">12 pendientes · 2 seleccionadas</div>
      </div>
      <button style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C4C9D2; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #15171C">Cancelar</button>
    </div>
    <div role="tablist" style="padding: 4px; border-radius: 14px; background: #E8EBEF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <button role="tab" aria-selected="true" style="min-height: 38px; border: 0; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(21,23,28,0.12); font-size: 13px; font-weight: 800; color: #15171C">Pendientes</button>
      <button role="tab" aria-selected="false" style="min-height: 38px; border: 0; border-radius: 10px; background: transparent; font-size: 13px; font-weight: 700; color: #5B6170">A futuro · 3</button>
      <button role="tab" aria-selected="false" style="min-height: 38px; border: 0; border-radius: 10px; background: transparent; font-size: 13px; font-weight: 700; color: #5B6170">Archivadas</button>
    </div>
    <div style="display: flex; gap: 8px; overflow: hidden">
      <button aria-pressed="true" style="min-height: 34px; padding: 0 12px; border-radius: 17px; border: 0; background: #15171C; color: #FFFFFF; font-size: 13px; font-weight: 700; white-space: nowrap">Todas</button>
      <button aria-pressed="false" style="min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #E3E6EB; background: #FFFFFF; font-size: 13px; font-weight: 600; white-space: nowrap; color: #15171C">Must</button>
      <button aria-pressed="false" style="min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #E3E6EB; background: #FFFFFF; font-size: 13px; font-weight: 600; white-space: nowrap; color: #15171C">Recommended</button>
      <button aria-pressed="false" style="min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #E3E6EB; background: #FFFFFF; font-size: 13px; font-weight: 600; white-space: nowrap; color: #15171C">Maybe</button>
      <button aria-pressed="false" style="min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #E3E6EB; background: #FFFFFF; font-size: 13px; font-weight: 600; white-space: nowrap; color: #15171C">Más pospuestas</button>
    </div>
  </header>

  <main style="padding: 0 20px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #5B6170">{{sec.title}}</h2>
        <sc-for list="{{sec.items}}" as="it" hint-placeholder-count="3">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 14px; background: #FFFFFF; border: {{it.border}}; border-radius: 14px; box-sizing: border-box">
            <input type="checkbox" checked="{{it.sel}}" style="width: 22px; height: 22px; accent-color: #15171C; margin: 0">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
              <span style="font-size: 15px; font-weight: 700">{{it.title}}</span>
              <span style="font-size: 12px; font-weight: 600; color: #5B6170">{{it.meta}}</span>
            </span>
            <span style="padding: 4px 8px; border-radius: 6px; background: {{it.tint}}; color: {{it.ink}}; font-size: 11px; font-weight: 800">{{it.lvl}}</span>
          </label>
        </sc-for>
      </section>
    </sc-for>
  </main>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 96px; padding: 10px; border-radius: 20px; background: #15171C; display: flex; gap: 8px; box-shadow: 0 10px 24px rgba(21,23,28,0.3)">
    <a href="Main.dc.html" style="flex: 1.4; min-height: 48px; border-radius: 14px; background: #FFFFFF; color: #15171C; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>Recuperar a hoy
    </a>
    <button style="flex: 1; min-height: 48px; border-radius: 14px; border: 1px solid #5B6170; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>Archivar
    </button>
  </div>

  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E3E6EB; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Hoy
    </a>
    <a href="Pool.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #15171C; font-size: 12px; font-weight: 800">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg>Pool
    </a>
    <a href="Semana.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>Calendario
    </a>
    <a href="Ajustes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var L = {
      must: { lvl: 'MUST', tint: '#FBEAE8', ink: '#B0302A' },
      should: { lvl: 'RECOMMENDED', tint: '#FDF3DC', ink: '#8A5A00' },
      maybe: { lvl: 'MAYBE', tint: '#E7EEFC', ink: '#2559C7' }
    };
    function row(title, meta, l, sel) {
      return Object.assign({ title: title, meta: meta, sel: sel, border: sel ? '2px solid #15171C' : '1px solid #E3E6EB' }, L[l]);
    }
    return {
      sections: [
        { title: 'ESTA SEMANA', items: [
          row('Preparar la demo del viernes', 'Ayer · pospuesta 1 vez', 'must', true),
          row('Comprar regalo para Lucía', '18 oct · pospuesta 2 veces', 'should', true),
          row('Ordenar fotos del verano', '19 oct · pospuesta 1 vez', 'maybe', false)
        ]},
        { title: 'MÁS ANTIGUAS', items: [
          row('Renovar el DNI', '14 oct · pospuesta 4 veces', 'must', false),
          row('Pedir cita al dentista', '9 oct · pospuesta 6 veces', 'must', false)
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
