<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editar tarea</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000}
button,input,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: Manrope, system-ui, sans-serif; color: #15171C; box-sizing: border-box">

  <header style="padding: 52px 12px 4px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #5B6170; text-decoration: none">Cancelar</a>
    <h1 style="margin: 0; font-size: 16px; font-weight: 800">Editar tarea</h1>
    <a href="Main.dc.html" style="min-height: 44px; padding: 0 10px; display: flex; align-items: center; font-size: 15px; font-weight: 800; color: #15171C; text-decoration: none">Guardar</a>
  </header>

  <form style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <label style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #5B6170">TAREA</span>
      <input type="text" value="Renovar el DNI" style="border: 0; border-bottom: 2px solid #15171C; padding: 6px 0 8px; font-size: 22px; font-weight: 700; color: #15171C; outline: none; background: transparent">
    </label>

    <fieldset style="border: 0; padding: 0; margin: 0">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #5B6170">NIVEL DE EXIGENCIA</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <label style="min-height: 58px; border-radius: 14px; border: 2px solid #C9372C; background: #FBEAE8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <input type="radio" name="lvl" checked style="position: absolute; opacity: 0">
          <span style="font-size: 15px; font-weight: 800; color: #7E1F19">Must</span>
          <span style="font-size: 11px; font-weight: 700; color: #7E1F19">1 hoy</span>
        </label>
        <label style="min-height: 58px; border-radius: 14px; border: 1px solid #E3E6EB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <input type="radio" name="lvl" style="position: absolute; opacity: 0">
          <span style="font-size: 14px; font-weight: 800; color: #8A5A00">Recommended</span>
          <span style="font-size: 11px; font-weight: 600; color: #5B6170">2 hoy</span>
        </label>
        <label style="min-height: 58px; border-radius: 14px; border: 1px solid #E3E6EB; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <input type="radio" name="lvl" style="position: absolute; opacity: 0">
          <span style="font-size: 15px; font-weight: 800; color: #2559C7">Maybe</span>
          <span style="font-size: 11px; font-weight: 600; color: #5B6170">0 hoy</span>
        </label>
      </div>
    </fieldset>

    <fieldset style="border: 0; padding: 0; margin: 0">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #5B6170">CATEGORÍA</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="false" style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #15171C; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2559C7"></span>Trabajo</button>
        <button type="button" aria-pressed="false" style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #15171C; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #1F8A5B"></span>Casa</button>
        <button type="button" aria-pressed="true" style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #15171C; color: #FFFFFF; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #C9A6F2"></span>Personal</button>
        <button type="button" aria-pressed="false" style="min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E3E6EB; background: #FFFFFF; color: #15171C; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #D06A1F"></span>Salud</button>
        <button type="button" style="min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px dashed #C4C9D2; background: #FFFFFF; color: #5B6170; font-size: 13px; font-weight: 600">+ Nueva</button>
      </div>
    </fieldset>

    <fieldset style="border: 0; padding: 0; margin: 0">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #5B6170">¿CUÁNDO?</legend>
      <div style="padding: 4px; border-radius: 14px; background: #F0F2F5; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
        <button type="button" aria-pressed="true" style="min-height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(21,23,28,0.12); font-size: 14px; font-weight: 800; color: #15171C">Hoy</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; font-weight: 700; color: #5B6170">Otro día</button>
        <button type="button" aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; font-weight: 700; color: #5B6170">Al pool</button>
      </div>
    </fieldset>

    <div style="border: 1px solid #E3E6EB; border-radius: 16px; display: flex; flex-direction: column">
      <label style="min-height: 64px; padding: 8px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E3E6EB; box-sizing: border-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6 4 4H6l4-4z"/><path d="M12 13v8"/></svg>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">Fijar</span>
          <span style="font-size: 12px; font-weight: 500; color: #5B6170">Se queda en Hoy cada día hasta completarla · día 3</span>
        </span>
        <span style="width: 48px; height: 28px; border-radius: 14px; background: #15171C; position: relative; flex-shrink: 0"><span style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
        <input type="checkbox" checked style="position: absolute; opacity: 0">
      </label>
      <div style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E3E6EB">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 600">Hora y recordatorio</span>
        <span style="font-size: 14px; font-weight: 700; color: #5B6170">Sin hora</span>
      </div>
      <div style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E3E6EB">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 600">Repetir</span>
        <span style="font-size: 14px; font-weight: 700; color: #5B6170">No se repite</span>
      </div>
      <div style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #E3E6EB">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 600">Notas</span>
        <span style="font-size: 14px; font-weight: 700; color: #5B6170">Llevar foto y el DNI viejo</span>
      </div>
      <label style="min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 12px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 600">Favorita</span>
        <span style="width: 48px; height: 28px; border-radius: 14px; background: #D3D7DE; position: relative; flex-shrink: 0"><span style="position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
        <input type="checkbox" style="position: absolute; opacity: 0">
      </label>
    </div>

    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; min-height: 48px; border-radius: 14px; border: 1px solid #E3E6EB; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #15171C">Archivar</button>
      <button type="button" style="flex: 1; min-height: 48px; border-radius: 14px; border: 1px solid #F0C7C3; background: #FFFFFF; font-size: 14px; font-weight: 700; color: #B0302A">Eliminar</button>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</script>
</body>
</html>
