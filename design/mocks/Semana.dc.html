<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calendario, semana</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F8; font-family: Manrope, system-ui, sans-serif; color: #15171C; box-sizing: border-box">

  <header style="padding: 56px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Calendario</h1>
    <div role="tablist" style="padding: 4px; border-radius: 14px; background: #E8EBEF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <button role="tab" aria-selected="false" style="min-height: 38px; border: 0; border-radius: 10px; background: transparent; font-size: 13px; font-weight: 700; color: #5B6170">Día</button>
      <button role="tab" aria-selected="true" style="min-height: 38px; border: 0; border-radius: 10px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(21,23,28,0.12); font-size: 13px; font-weight: 800; color: #15171C">Semana</button>
      <a href="Mes.dc.html" role="tab" aria-selected="false" style="min-height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #5B6170; text-decoration: none">Mes</a>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Semana anterior" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E3E6EB; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div style="text-align: center">
        <div style="font-size: 16px; font-weight: 800">19 – 25 oct</div>
        <div style="font-size: 12px; font-weight: 600; color: #5B6170">Semana 43 · 9 de 13 hechas</div>
      </div>
      <button aria-label="Semana siguiente" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E3E6EB; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </header>

  <main style="padding: 0 20px; display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <div style="display: flex; gap: 12px; padding: 8px 12px; min-height: 58px; box-sizing: border-box; border-radius: 14px; background: {{d.bg}}; border: {{d.border}}">
        <div style="width: 40px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: {{d.labelInk}}">{{d.dow}}</span>
          <span style="font-size: 20px; font-weight: 800; line-height: 1.1">{{d.num}}</span>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px">
          <sc-for list="{{d.tasks}}" as="t" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden">
              <span style="width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; background: {{t.color}}"></span>
              <sc-if value="{{t.done}}" hint-placeholder-val="{{ true }}"><span style="color: #8A909C; text-decoration: line-through; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span></sc-if>
              <sc-if value="{{t.open}}" hint-placeholder-val="{{ false }}"><span style="overflow: hidden; text-overflow: ellipsis">{{t.title}}</span></sc-if>
            </div>
          </sc-for>
          <sc-if value="{{d.empty}}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; font-weight: 600; color: #5B6170">Sin plan</div></sc-if>
        </div>
        <div style="flex-shrink: 0; display: flex; align-items: center">
          <span style="padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 800; background: {{d.pillBg}}; color: {{d.pillInk}}">{{d.score}}</span>
        </div>
      </div>
    </sc-for>
  </main>

  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E3E6EB; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Hoy
    </a>
    <a href="Pool.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg>Pool
    </a>
    <a href="Semana.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #15171C; font-size: 12px; font-weight: 800">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>Calendario
    </a>
    <a href="Ajustes.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var C = { m: '#C9372C', s: '#E0A100', y: '#2559C7' };
    function t(title, lvl, done) { return { title: title, color: C[lvl], done: done, open: !done }; }
    function day(dow, num, kind, tasks, score) {
      var today = kind === 'today', future = kind === 'future', ok = kind === 'ok', miss = kind === 'miss';
      return {
        dow: dow, num: num, tasks: tasks.slice(0, 2), empty: tasks.length === 0, score: score,
        bg: today ? '#FFFFFF' : (future ? 'transparent' : '#FFFFFF'),
        border: today ? '2px solid #15171C' : (future ? '1.5px dashed #C4C9D2' : '1px solid #E3E6EB'),
        labelInk: today ? '#15171C' : '#5B6170',
        pillBg: ok ? '#15171C' : (miss ? '#FBEAE8' : (today ? '#E8EBEF' : 'transparent')),
        pillInk: ok ? '#FFFFFF' : (miss ? '#7E1F19' : '#5B6170')
      };
    }
    return {
      days: [
        day('LUN', '19', 'ok', [t('Cerrar presupuesto Q4', 'm', true), t('Gimnasio', 'm', true)], '4/4'),
        day('MAR', '20', 'miss', [t('Preparar la demo del viernes', 'm', false), t('Comprar regalo para Lucía', 's', false)], '2/4'),
        day('MIÉ', '21', 'today', [t('Enviar propuesta a Ortega S.L.', 'm', true), t('Llamar al seguro del coche', 'm', false)], '1/4'),
        day('JUE', '22', 'future', [t('Revisión médica 9:00', 'm', false)], '1 prog.'),
        day('VIE', '23', 'future', [t('Demo con el cliente 12:00', 'm', false)], '1 prog.'),
        day('SÁB', '24', 'future', [], ''),
        day('DOM', '25', 'future', [], '')
      ]
    };
  }
}
</script>
</body>
</html>
