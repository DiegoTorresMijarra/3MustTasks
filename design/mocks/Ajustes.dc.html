<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajustes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171C}a:hover{color:#000}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F6F8; font-family: Manrope, system-ui, sans-serif; color: #15171C; box-sizing: border-box">

  <header style="padding: 56px 20px 10px">
    <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Ajustes</h1>
  </header>

  <section style="padding: 0 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #5B6170">NIVELES Y MÍNIMOS DIARIOS</h2>
      <span style="font-size: 12px; font-weight: 700; color: #5B6170">Total: 3/día</span>
    </div>
    <sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
      <div style="padding: 10px 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E6EB; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#8A909C" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
          <span style="width: 18px; height: 18px; border-radius: 6px; background: {{l.color}}"></span>
          <span style="flex: 1; font-size: 15px; font-weight: 800">{{l.name}}</span>
          <button aria-label="Editar {{l.name}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #F0F2F5; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>
          </button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{l.fields}}" as="f" hint-placeholder-count="3">
            <div style="padding: 6px 6px 6px 10px; border-radius: 10px; background: #F5F6F8; display: flex; align-items: center; justify-content: space-between; gap: 4px">
              <span style="display: flex; flex-direction: column">
                <span style="font-size: 10px; font-weight: 800; letter-spacing: 0.04em; color: #5B6170">{{f.label}}</span>
                <span style="font-size: 17px; font-weight: 800">{{f.value}}</span>
              </span>
              <span style="display: flex; flex-direction: column; gap: 2px">
                <button aria-label="Subir {{f.label}}" style="width: 26px; height: 20px; border: 0; border-radius: 6px; background: #FFFFFF; font-size: 13px; font-weight: 800; line-height: 1; color: #15171C">+</button>
                <button aria-label="Bajar {{f.label}}" style="width: 26px; height: 20px; border: 0; border-radius: 6px; background: #FFFFFF; font-size: 13px; font-weight: 800; line-height: 1; color: #15171C">−</button>
              </span>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <div style="display: flex; gap: 8px">
      <button style="flex: 1; min-height: 40px; border-radius: 12px; border: 1.5px dashed #C4C9D2; background: transparent; font-size: 13px; font-weight: 700; color: #3D424D">+ Añadir nivel</button>
      <button style="flex: 1; min-height: 40px; border-radius: 12px; border: 0; background: transparent; font-size: 13px; font-weight: 700; color: #5B6170; text-decoration: underline">Restaurar por defecto</button>
    </div>
  </section>

  <section style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #5B6170">RECORDATORIOS</h2>
    <div style="border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E6EB">
      <sc-for list="{{reminders}}" as="r" hint-placeholder-count="4">
        <div style="min-height: 48px; padding: 6px 14px; display: flex; align-items: center; gap: 12px; border-top: {{r.border}}; box-sizing: border-box">
          <span style="flex: 1; display: flex; flex-direction: column">
            <span style="font-size: 14px; font-weight: 700">{{r.title}}</span>
            <span style="font-size: 12px; font-weight: 500; color: #5B6170">{{r.detail}}</span>
          </span>
          <span style="width: 44px; height: 26px; border-radius: 13px; background: {{r.track}}; position: relative; flex-shrink: 0"><span style="position: absolute; top: 3px; left: {{r.knob}}; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"></span></span>
        </div>
      </sc-for>
    </div>
  </section>

  <nav aria-label="Principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E3E6EB; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 10px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Hoy
    </a>
    <a href="Pool.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/></svg>Pool
    </a>
    <a href="Semana.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #5B6170; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>Calendario
    </a>
    <a href="Ajustes.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 44px; text-decoration: none; color: #15171C; font-size: 12px; font-weight: 800">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    function lvl(name, color, add, done, max) {
      return { name: name, color: color, fields: [
        { label: 'AÑADIR', value: add }, { label: 'COMPLETAR', value: done }, { label: 'MÁXIMO', value: max }
      ]};
    }
    function rem(title, detail, on, first) {
      return { title: title, detail: detail, track: on ? '#15171C' : '#D3D7DE', knob: on ? '21px' : '3px', border: first ? '0' : '1px solid #E3E6EB' };
    }
    return {
      levels: [
        lvl('Must', '#C9372C', 1, 1, '—'),
        lvl('Recommended', '#E0A100', 2, 0, '—'),
        lvl('Maybe', '#2559C7', 0, 0, '—')
      ],
      reminders: [
        rem('¡Añade tus tareas!', '07:30 · L M X J V S D', true, true),
        rem('Insistir si falta plan', 'Cada 30 min · máx. 4 al día', true, false),
        rem('Falta completar mínimo', '18:00', true, false),
        rem('Resumen nocturno', '21:00', false, false)
      ]
    };
  }
}
</script>
</body>
</html>
