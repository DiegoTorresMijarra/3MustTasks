name: Deploy PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Base href para GitHub Pages (/<repo>/)
        run: bash scripts/set-pwa-base.sh "/${GITHUB_REPOSITORY#*/}/"

      - name: Publish PWA
        run: dotnet publish src/ThreeMustTasks.App.Web -c Release -o publish/web

      - name: Preparar sitio estático
        run: |
          site=publish/web/wwwroot
          # Fallback SPA: GitHub Pages sirve 404.html en rutas desconocidas
          cp "$site/index.html" "$site/404.html"
          # Evita que Jekyll ignore las carpetas _framework y _content
          touch "$site/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/web/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
