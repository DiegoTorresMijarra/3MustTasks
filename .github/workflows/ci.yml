name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ThreeMustTasks.sln

      - name: Build (warnings as errors)
        run: dotnet build ThreeMustTasks.sln --no-restore -c Release -warnaserror

      - name: Test with coverage
        run: >
          dotnet test ThreeMustTasks.sln --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Coverage report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage \
            -reporttypes:"MarkdownSummaryGithub;Html;Cobertura"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Publish PWA
        run: dotnet publish src/ThreeMustTasks.App.Web -c Release -o publish/web

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwa
          path: publish/web/wwwroot
