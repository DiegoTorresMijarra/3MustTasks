<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15171C" />
    <meta name="color-scheme" content="light dark" />
    <title>3MustTasks</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/ThreeMustTasks.UI/tmt.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-text" role="status" aria-live="polite"><img src="icon-192.png" width="96" height="96" alt="" /><span>3MustTasks</span></div>
    </div>

    <div id="blazor-error-ui">
        Ha ocurrido un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss" role="button" tabindex="0" aria-label="Cerrar aviso">🗙</span>
    </div>
    <script>
        // Avisa a la app cuando la pestaña/PWA vuelve a primer plano (cierre de día).
        window.tmtLifecycle = {
            register: function (ref) {
                document.addEventListener('visibilitychange', function () {
                    if (document.visibilityState === 'visible') ref.invokeMethodAsync('OnForeground');
                });
            }
        };
    </script>
    <script>
        // Permiso de notificaciones (onboarding). Devuelve granted | denied | default | unsupported.
        window.tmtNotifications = {
            requestPermission: async function () {
                if (!('Notification' in window)) return 'unsupported';
                return await Notification.requestPermission();
            }
        };
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
